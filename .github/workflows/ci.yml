name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: find src templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer lint
        if: matrix.php == '8.3'
      - name: Prefixed library is committed and up to date
        run: git diff --exit-code -- vendor-prefixed assets/core
